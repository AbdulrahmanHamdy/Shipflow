<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="sf-grad" x1="10" y1="90" x2="90" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="sf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10B981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Hexagonal logistics container outline -->
  <polygon points="50,8 86,28 86,72 50,92 14,72 14,28" 
           stroke="url(#sf-grad)" stroke-width="6" stroke-linejoin="round" fill="none" opacity="0.3"/>

  <!-- Dynamic S-curve routing flow -->
  <path d="M 32 30 C 48 18, 70 30, 68 46 C 66 60, 34 52, 32 68 C 30 82, 54 86, 68 76" 
        stroke="url(#sf-grad)" stroke-width="7" stroke-linecap="round" fill="none" filter="url(#sf-glow)"/>

  <!-- Origin waypoint pin -->
  <circle cx="32" cy="30" r="6" fill="#15803D" stroke="#FFFFFF" stroke-width="2.5"/>
  
  <!-- Destination waypoint pin -->
  <circle cx="68" cy="76" r="6" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- Midpoint pulse node -->
  <circle cx="50" cy="51" r="3.5" fill="#DCFCE7"/>
</svg>
