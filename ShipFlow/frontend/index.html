<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShipFlow | Smart Logistics &amp; Shipment Management</title>
    <meta name="description" content="Enterprise control-tower logistics platform. Manage shipments, coordinate drivers, monitor deliveries, and keep every movement visible from dispatch to destination." />
    <meta name="theme-color" content="#0B2A1F" />
    <meta name="application-name" content="ShipFlow" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ShipFlow | Smart Logistics &amp; Shipment Management" />
    <meta property="og:description" content="Every Shipment. One Clear Journey. Enterprise logistics SaaS for shipments, fleet, and delivery management." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ShipFlow | Smart Logistics &amp; Shipment Management" />
    <meta name="twitter:description" content="Every Shipment. One Clear Journey. Enterprise logistics SaaS." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Critical Splash Screen Inline Styles -->
    <style>
      #app-boot-splash {
        position: fixed;
        inset: 0;
        background-color: #0B2A1F;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #F4F8F5;
        transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
      }
      #app-boot-splash.splash-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-logo-mark {
        width: 72px;
        height: 72px;
        animation: pulseSubtle 2s infinite ease-in-out;
      }
      .splash-route-line {
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: drawRoute 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      .splash-title {
        margin-top: 18px;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.5px;
        color: #FFFFFF;
        opacity: 0;
        animation: fadeInWordmark 0.6s 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .splash-subtitle {
        margin-top: 6px;
        font-size: 13px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: #10B981;
        opacity: 0;
        animation: fadeInWordmark 0.6s 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .splash-spinner {
        margin-top: 24px;
        width: 20px;
        height: 20px;
        border: 2px solid rgba(220, 252, 231, 0.15);
        border-top-color: #10B981;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes drawRoute {
        to { stroke-dashoffset: 0; }
      }
      @keyframes fadeInWordmark {
        to { opacity: 1; transform: translateY(0); }
        from { opacity: 0; transform: translateY(6px); }
      }
      @keyframes pulseSubtle {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-logo-mark, .splash-route-line, .splash-title, .splash-subtitle, .splash-spinner {
          animation: none !important;
          opacity: 1 !important;
          stroke-dashoffset: 0 !important;
        }
      }
    </style>
  </head>
  <body class="bg-neutral-appBg text-neutral-primary antialiased selection:bg-brand-mint selection:text-brand-mintText min-h-screen">
    <!-- Boot Splash Element -->
    <div id="app-boot-splash" aria-hidden="true">
      <svg class="splash-logo-mark" viewBox="0 0 100 100" fill="none">
        <polygon points="50,8 86,28 86,72 50,92 14,72 14,28" stroke="#123B2B" stroke-width="5" fill="#0B2A1F" />
        <path class="splash-route-line" d="M 32 30 C 48 18, 70 30, 68 46 C 66 60, 34 52, 32 68 C 30 82, 54 86, 68 76" stroke="#10B981" stroke-width="7" stroke-linecap="round" fill="none" />
        <circle cx="32" cy="30" r="5" fill="#15803D" stroke="#FFFFFF" stroke-width="2"/>
        <circle cx="68" cy="76" r="5" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
      </svg>
      <div class="splash-title">ShipFlow</div>
      <div class="splash-subtitle">Logistics Platform</div>
      <div class="splash-spinner" id="splash-loader" aria-label="Initializing app"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
